units:
  kx: u
  ky: u
  px: kx + 4
  py: ky + 4
  dpx: kx + 8
  dpy: ky + 8
  screwSize: 1.5
  standoffSize: 2.5
points:
  zones:
    matrix:
      anchor:
        shift: [100, -100]
      key:
        padding: ky
        spread: kx
      columns:
        outer:
          key:
            column_net: P14
            mirror.column_net: P1
        pinky:
          key:
            stagger: 15
            splay: 0
            column_net: P21
            mirror.column_net: P4
        ring:
          key:
            stagger: 10
            column_net: P20
            mirror.column_net: P5
        middle:
          key:
            stagger: -10
            column.net: P19
            mirror.column_net: P6
        index:
          key:
            stagger: -5
            column_net: P18
            mirror.column_net: P7
      rows:
        mods:
          row_net: P10
        bottom:
          row_net: P16
        home:
          row_net: P14
    thumbs:
      key:
        padding: ky
        spread: kx
      anchor:
        ref: matrix_index_mods
        shift: [2, -1.2ky]
      columns:
        layer:
          key:
            splay: -20
        space:
          key:
            width: 1.5kx
            splay: 67
            shift: [-4, -5]
      rows:
        cluster:
  rotate: -20
  mirror: &mirror
    ref: matrix_index_home
    distance: 2kx
outlines:
  raw:
    - what: rectangle
      where: true
      size: [px, py]
  keys:
    - what: rectangle
      where: true
      bound: false
      size: [kx-0.5, ky-0.5]
  board:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_outer_home
          shift: [-0.5px, 0.5py]
        - ref: matrix_pinky_home
          shift: [-0.5px, 0.5py]
        - ref: matrix_ring_home
          shift: [-0.5px, 0.5py]
        - ref: matrix_ring_home
          shift: [0.5px, 0.5py]
        - ref: matrix_middle_home
          shift: [0.5px, 0.5py]
        - ref: matrix_index_home
          shift: [0.5px, 0.5py]
        - ref: matrix_index_home
          shift: [0.5px, 0]
        - ref: mirror_matrix_index_home
          shift: [0.5px, 0]
        - ref: mirror_matrix_index_home
          shift: [0.5px, 0.5py]
        - ref: mirror_matrix_middle_home
          shift: [0.5px, 0.5py]
        - ref: mirror_matrix_ring_home
          shift: [0.5px, 0.5py]
        - ref: mirror_matrix_ring_home
          shift: [-0.5px, 0.5py]
        - ref: mirror_matrix_pinky_home
          shift: [-0.5px, 0.5py]
        - ref: mirror_matrix_outer_home
          shift: [-0.5px, 0.5py]
        - ref: mirror_matrix_outer_mods
          shift: [-0.5px, -0.5py]
        - ref: mirror_thumbs_layer_cluster
          shift: [-0.5px, -0.5py]
        - ref: mirror_thumbs_space_cluster
          shift: [-0.75px, -0.5py]
        - ref: mirror_thumbs_space_cluster
          shift: [0.75px, -0.5py]
        - ref: thumbs_space_cluster
          shift: [0.75px, -0.5py]
        - ref: thumbs_space_cluster
          shift: [-0.75px, -0.5py]
        - ref: thumbs_layer_cluster
          shift: [-0.5px, -0.5py]
        - ref: matrix_outer_mods
          shift: [-0.5px, -0.5py]
      fillet: 2
  xlboard:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_outer_home
          shift: [-0.5dpx, 0.5dpy]
        - ref: matrix_pinky_home
          shift: [-0.5dpx, 0.5dpy]
        - ref: matrix_ring_home
          shift: [-0.5dpx, 0.5dpy]
        - ref: matrix_ring_home
          shift: [0.5dpx, 0.5dpy]
        - ref: matrix_middle_home
          shift: [0.5dpx, 0.5dpy]
        - ref: matrix_index_home
          shift: [0.5dpx, 0.5dpy]
        - ref: matrix_index_home
          shift: [0.5dpx, 0]
        - ref: mirror_matrix_index_home
          shift: [0.5dpx, 0]
        - ref: mirror_matrix_index_home
          shift: [0.5dpx, 0.5dpy]
        - ref: mirror_matrix_middle_home
          shift: [0.5dpx, 0.5dpy]
        - ref: mirror_matrix_ring_home
          shift: [0.5dpx, 0.5dpy]
        - ref: mirror_matrix_ring_home
          shift: [-0.5dpx, 0.5dpy]
        - ref: mirror_matrix_pinky_home
          shift: [-0.5dpx, 0.5dpy]
        - ref: mirror_matrix_outer_home
          shift: [-0.5dpx, 0.5dpy]
        - ref: mirror_matrix_outer_mods
          shift: [-0.5dpx, -0.5dpy]
        - ref: mirror_thumbs_layer_cluster
          shift: [-0.5dpx, -0.5dpy]
        - ref: mirror_thumbs_space_cluster
          shift: [-0.75dpx, -0.5dpy]
        - ref: mirror_thumbs_space_cluster
          shift: [0.75dpx, -0.5dpy]
        - ref: thumbs_space_cluster
          shift: [0.75dpx, -0.5dpy]
        - ref: thumbs_space_cluster
          shift: [-0.75dpx, -0.5dpy]
        - ref: thumbs_layer_cluster
          shift: [-0.5dpx, -0.5dpy]
        - ref: matrix_outer_mods
          shift: [-0.5dpx, -0.5dpy]
      fillet: 2
  combo:
    - name: board
    - operation: subtract
      name: keys
  mounting:
    - what: circle
      radius: screwSize
      where:
        ref: [matrix_outer_home]
        shift: [0.5kx, -0.3ky]
    - what: circle
      radius: screwSize
      where:
        ref: [matrix_outer_mods]
        shift: [0.5kx, -0.3ky]
    - what: circle
      radius: screwSize
      where:
        ref: [matrix_middle_home]
        shift: [0.5kx, -0.4ky]
    - what: circle
      radius: screwSize
      where:
        ref: [matrix_middle_mods]
        shift: [0.5kx, -0.35ky]
    - what: circle
      radius: screwSize
      where:
        ref: [mirror_matrix_outer_home]
        shift: [0.5kx, -0.3ky]
    - what: circle
      radius: screwSize
      where:
        ref: [mirror_matrix_outer_mods]
        shift: [0.5kx, -0.3ky]
    - what: circle
      radius: screwSize
      where:
        ref: [mirror_matrix_middle_home]
        shift: [0.5kx, -0.4ky]
    - what: circle
      radius: screwSize
      where:
        ref: [mirror_matrix_middle_mods]
        shift: [0.5kx, -0.35ky]
  standoff:
    - what: circle
      radius: standoffSize
      where:
        ref: [matrix_outer_home]
        shift: [0.5kx, -0.3ky]
    - what: circle
      radius: standoffSize
      where:
        ref: [matrix_outer_mods]
        shift: [0.5kx, -0.3ky]
    - what: circle
      radius: standoffSize
      where:
        ref: [matrix_middle_home]
        shift: [0.5kx, -0.4ky]
    - what: circle
      radius: standoffSize
      where:
        ref: [matrix_middle_mods]
        shift: [0.5kx, -0.35ky]
    - what: circle
      radius: standoffSize
      where:
        ref: [mirror_matrix_outer_home]
        shift: [0.5kx, -0.3ky]
    - what: circle
      radius: standoffSize
      where:
        ref: [mirror_matrix_outer_mods]
        shift: [0.5kx, -0.3ky]
    - what: circle
      radius: standoffSize
      where:
        ref: [mirror_matrix_middle_home]
        shift: [0.5kx, -0.4ky]
    - what: circle
      radius: standoffSize
      where:
        ref: [mirror_matrix_middle_mods]
        shift: [0.5kx, -0.35ky]
pcbs:
  absonity:
    outlines:
      main:
        outline: board
    footprints:
      mx_hotswap:
        what: mx
        where: true
        params:
          keycaps: true
          reverse: false
          hotswap: true
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: diode
        where: true
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -5]
      promicro:
        what: promicro
        params:
          orientation: "down"
        where:
          ref.aggregate.parts: [matrix_index_bottom, mirror_matrix_index_bottom]
          shift: [0, -2]
          rotate: -90
      oled:
        what: oled
        params:
          side: "F"
          SDA: P2
          SCL: P3
        where:
          ref.aggregate.parts: [matrix_index_bottom, mirror_matrix_index_bottom]
          shift: [-6, -21]
          rotate: 90
      reset:
        what: button
        params:
          from: GND
          to: RST
        where:
          ref.aggregate.parts: [matrix_index_mods, mirror_matrix_index_mods]
          shift: [0, -8]
          rotate: -90
      holeTopLLeft:
        what: mountinghole
        where:
          ref: [matrix_outer_home]
          shift: [0.5kx, -0.3ky]
      holeBottomLeft:
        what: mountinghole
        where:
          ref: [matrix_outer_mods]
          shift: [0.5kx, -0.3ky]
      holeTopInnerLeft:
        what: mountinghole
        where:
          ref: [matrix_middle_home]
          shift: [0.5kx, -0.4ky]
      holeBottomInnerLeft:
        what: mountinghole
        where: 
          ref: [matrix_middle_mods]
          shift: [0.5kx, -0.35ky]
      holeTopRight:
        what: mountinghole
        where:
          ref: [mirror_matrix_outer_home]
          shift: [0.5kx, -0.3ky]
      holeBottomRight:
        what: mountinghole
        where:
          ref: [mirror_matrix_outer_mods]
          shift: [0.5kx, -0.3ky]
      holeTopInnerRight:
        what: mountinghole
        where:
          ref: [mirror_matrix_middle_home]
          shift: [0.5kx, -0.4ky]
      holeBottomInnerRight:
        what: mountinghole
        where:
          ref: [mirror_matrix_middle_mods]
          shift: [0.5kx, -0.35ky]
cases:
  bottom:
    - name: board
      extrude: 1
  xlbottom:
    - name: xlboard
      extrude: 1
  _outerwall:
    - name: xlboard
      extrude: 4
  _innerwall:
    - name: board
      extrude: 4
  wall:
    - what: case
      name: _outerwall
      operation: add
    - what: case
      name: _innerwall
      operation: subtract
  _holes:
    - name: mounting
      extrude: 4
  _standoffs:
    - name: standoff
      extrude: 4
  case:
    - what: case
      name: _standoffs
      operation: add
    - what: case
      name: _holes
      operation: subtract
    - what: case
      name: xlbottom
      operation: add
    - what: case
      name: wall
      operation: add